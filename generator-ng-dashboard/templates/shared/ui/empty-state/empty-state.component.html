<div class="flex flex-col items-center justify-center p-12 text-center rounded-lg border border-dashed border-[hsl(var(--border))] bg-[hsl(var(--card))]/50">
  <div class="h-12 w-12 rounded-full bg-[hsl(var(--muted))] flex items-center justify-center mb-4">
    <ng-icon [name]="iconName()" class="text-2xl text-[hsl(var(--muted-foreground))]"></ng-icon>
  </div>
  <h3 class="text-lg font-semibold text-[hsl(var(--foreground))]">{{ title() }}</h3>
  <p class="mt-2 text-sm text-[hsl(var(--muted-foreground))] max-w-sm">{{ description() }}</p>
  <div class="mt-6">
    <ng-content></ng-content>
  </div>
</div>
