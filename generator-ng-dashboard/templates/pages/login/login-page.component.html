<div class="min-h-screen flex items-center justify-center bg-background text-foreground p-4">
  <div class="w-full max-w-md bg-card rounded-xl border border-border shadow-2xl p-8 space-y-6">
    <div class="space-y-2 text-center">
      <div class="inline-flex w-12 h-12 rounded-xl bg-primary text-primary-foreground font-extrabold text-2xl items-center justify-center shadow-md mb-2">
        A
      </div>
      <h1 class="text-2xl font-bold tracking-tight">Sign In</h1>
      <p class="text-xs text-muted-foreground">Enter your credentials to access your dashboard</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="space-y-1.5">
        <label for="email" class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="admin@example.com" 
          class="w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring"
        />
      </div>

      <div class="space-y-1.5">
        <label for="password" class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••" 
          class="w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring"
        />
      </div>

      @if (auth.error()) {
        <div class="text-xs text-destructive bg-destructive/10 border border-destructive/20 rounded-md p-3 font-medium">
          {{ auth.error() }}
        </div>
      }

      <button 
        type="submit" 
        [disabled]="isSubmitting()"
        class="w-full py-2.5 px-4 rounded-md bg-primary text-primary-foreground font-medium text-sm hover:bg-primary/90 transition-colors shadow-sm disabled:opacity-50 flex items-center justify-center gap-2"
      >
        @if (isSubmitting()) {
          <span class="w-4 h-4 border-2 border-primary-foreground border-t-transparent rounded-full animate-spin"></span>
        }
        Sign In
      </button>
    </form>
  </div>
</div>
